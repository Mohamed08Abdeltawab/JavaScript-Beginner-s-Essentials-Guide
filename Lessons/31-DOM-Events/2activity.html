<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>My Heading</h2>

    <p class="same-class">Paragraph 1</p>
    <p class="same-class">Paragraph 2</p>
    <p class="same-class">Paragraph 3</p>

    <button class="click">Click Me</button>

    <script>
      const pclass = document.getElementsByClassName("same-class");
      const hname = document.getElementsByTagName("h2");
      const button = document.querySelector(".click");

      button.addEventListener("click", () => {
        Array.from(pclass).forEach((p) => {
          p.style.color = "red";
          p.textContent = "update paragraph";
        });

        Array.from(hname).forEach((h2) => {
          h2.style.color = "red";
        });
      });
    </script>
  </body>
</html>
