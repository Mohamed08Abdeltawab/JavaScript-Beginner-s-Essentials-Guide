<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #f4f4f4;
        font-family: Arial, sans-serif;
      }

      input {
        padding: 10px;
        width: 300px;
        margin-bottom: 20px;
        font-size: 1.1rem;
      }

      button {
        padding: 12px 30px;
        margin: 6px;
        border: none;
        background: #007bff;
        color: white;
        font-size: 1rem;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        background: #0056b3;
        transform: scale(1.05);
      }

      #output {
        margin-top: 20px;
        font-size: 1.2rem;
      }
    </style>
  </head>
  <body>
    <input id="nameInput" type="text" placeholder="Enter your name..." />
    <input id="emailInput" type="email" placeholder="Enter your email..." />
    <input id="colorInput" type="color" placeholder="Enter your name..." />

    <button onclick="saveLS()">Save in Local Storage</button>
    <button onclick="loadLS()">Load from Local Storage</button>
    <button onclick="clearLS()">Clear Local Storage</button>

    <br />
    <div id="output"></div>

    <script>
      function saveLS() {
        let name = document.getElementById("nameInput").value;
        let email = document.getElementById("emailInput").value;
        let color = document.getElementById("colorInput").value;

        localStorage.setItem("name", name);
        localStorage.setItem("email", email);
        localStorage.setItem("color", color);

        alert("sotred in local storage.");
      }

      function loadLS() {
        let name = localStorage.getItem("name");
        let email = localStorage.getItem("email");
        let color = localStorage.getItem("color");

        document.getElementById("output").textContent =
          `local storage: ${name ?? `no name founded.`}, ${email ?? `no email founded.`}, ${color ?? `no color founded.`}`;
      }

      function clearLS() {
        localStorage.clear();
        alert("cleared.");
      }
    </script>
  </body>
</html>
