<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <button onclick="OpenAndCloseExample()">Open Window</button>

    <script>
      function OpenAndCloseExample() {
        let myWin = window.open("info.html", "_blank", "width=800, height=500");

        setTimeout(() => {
          myWin.close();
        }, 5000);
      }
    </script>
  </body>
</html>
