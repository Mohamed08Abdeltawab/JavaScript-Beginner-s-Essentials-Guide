<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Debug Session Demo</title>
  <style>
    body { font-family: sans-serif; padding: 40px; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Order Price Calculator</h2>
  <button id="calc-btn">Calculate Discounted Total</button>
  <h3 id="result"></h3>

  <script>
    function applyCoupon(price, couponCode) {
      let discountRate = 0;
      if (couponCode === "SAVE20") {
        discountRate = 0.20;
      }
      const finalPrice = price - (price * discountRate);
      return finalPrice;
    }

    function processOrder() {
      const basePrice = 250;
      const coupon = "SAVE20";
      const total = applyCoupon(basePrice, coupon);
      document.getElementById("result").textContent = `Total: $${total}`;
    }

    document.getElementById("calc-btn").addEventListener("click", processOrder);
  </script>
</body>
</html>
