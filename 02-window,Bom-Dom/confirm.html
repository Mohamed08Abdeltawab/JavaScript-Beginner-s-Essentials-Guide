  <body>
    <h2>this is confirm page</h2>

    <script>
      let result = confirm("Are you sure.");
      if (result) {
        alert("User agree.");
      } else {
        alert("User did not agree.");
      }


    //   method 2
    if(confirm("Are you sure you want to leave this page?")){
        window.location.href= "https://www.google.com";
    }
    else{
        alert("Stayed on the page!");
    }
    </script>
