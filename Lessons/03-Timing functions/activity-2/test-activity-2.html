<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      body {
        position: relative;
        background-image: url("./images/tasbeeh-gold.png");
        margin: 0;
        padding: 0;
        min-height: 100vh;
        /* background-size: cover; */
        background-color: black;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
      }

      header {
        display: flex;
        flex-direction: column;
        margin-left: 50px;
      }

      .avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        margin-left: 50px;
        margin-top: 20px;
      }

      .description {
        color: white;
        margin-left: 30px;
        display: block;
        transition: color 0.5s;
      }

      .description:hover {
        color: rgb(87, 87, 194);
      }

      .card {
        display: flex;
        flex-direction: column;
        background-color: black;
        justify-content: center;
        align-items: center;
        max-width: 700px;
        width: 80%;
        height: 300px;
        margin: 0 auto;
        border: 2px dashed gold;
        border-radius: 10px;
      }

      #word {
        color: white;
        display: block;
        font-weight: bold;
        font-size: 2rem;
        margin-top: -20px;
        max-width: 30ch;
        text-align: center;
      }

      .btn-start {
        padding: 20px 60px;
        font-size: 1.5rem;
        border-radius: 20px;
        transition: background-color 0.5s;
      }

      .btn-start:hover {
        background-color: goldenrod;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <img class="avatar" src="./images/logo.png" />
        <a
          class="description"
          target="_blank"
          href="https://www.programmingadvices.com"
          >Programming advices</a
        >
      </div>
    </header>

    <div class="card">
      <h3 id="word">ابدأ التسبيح</h3>
      <button class="btn-start" onclick="startTasbeh()">ابدأ</button>
    </div>

    <script>
      function startTasbeh() {
        let status = document.getElementById("word");
        let btn = document.querySelector(".btn-start");

        let phrases = ["سبحان الله", "الحمد لله", "الله أكبر"];
        let phraseIndex = 0;
        let count = 1;

        btn.disabled = true;

        let timer = setInterval(() => {
          status.textContent = `${phrases[phraseIndex]} (${count})`;

          count++;

          if (count > 33) {
            count = 1;
            phraseIndex++;
            if (phraseIndex === 0) status.style.color = "white";
            else if (phraseIndex === 1) status.style.color = "red";
            else if (phraseIndex === 2) status.style.color = "gold";
          }

          if (phraseIndex >= phrases.length) {
            clearInterval(timer);
            status.style.color = "green";
            status.textContent =
              "لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير";
            btn.disabled = false;
          }
        }, 100);
      }
    </script>
  </body>
</html>
